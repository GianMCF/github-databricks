# GitHub Actions workflow for Databricks deployment
name: CI

# Execute workflow when changes are pushed to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      REPO_PATH: /Workspace/Users/${{ secrets.DATABRICKS_EMAIL }}/github-databricks

    steps:
      # Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Update Databricks Git folder
      - name: Update Databricks Git folder
        run: |
          echo "Updating Databricks repository..."
          echo "Branch: $GITHUB_REF_NAME"
          echo "Repository: $REPO_PATH"

          databricks repos update "$REPO_PATH" --branch "$GITHUB_REF_NAME"

          echo "Databricks repository updated successfully."
